<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Stage 1 · Positioning</title>
    <script type="module" src="/src/stage-1.js"></script>
  </head>
  <!-- data-debug="on": grid, axes and position labels are visible. Use ?debug=0 to hide them. -->
  <body data-debug="on">
    <!--
      UNITS: 1 unit = 1 metre. Y points UP. The user starts at 0 0 0 and looks towards -Z.
      Position is "x y z", rotation is in degrees, scale 1 = normal size.
      Everything you need for the exercises is in THIS file. Reload happens on save.
    -->
    <!-- xr-buttons: shows both the VR and the AR (passthrough) button where supported. -->
    <a-scene xr-buttons background="color: #cfd8e3">
      <!-- Lights -->
      <a-entity light="type: ambient; intensity: 1.0; color: #fff"></a-entity>
      <a-entity light="type: directional; intensity: 0.7" position="1 3 2"></a-entity>

      <!-- CAMERA RIG. The rig stands on the floor (y = 0). The camera sits 1.6 m up = eye height
           on desktop. In VR the headset's real head pose takes over, so this height is ignored.
           WASD moves the rig, dragging the mouse turns the camera. -->
      <a-entity id="rig" position="0 0 0" wasd-controls thumbstick-move="hand: #left-hand">
        <a-entity id="head" camera position="0 1.6 0" look-controls>
          <!-- HEAD-LOCKED: a child of the camera. Its position is relative to your head, so it
               follows every head movement. z = -0.8 means 0.8 m in front of the face. -->
          <a-entity
            id="message-card"
            hint-card="title: Message; text: Alex: running 10 min late; tag: head-locked; accent: #ffb347; width: 0.5; height: 0.18"
            position="0 -0.15 -0.8"
            position-label="offsetY: -0.12; offsetZ: 0; width: 0.4"
          ></a-entity>
        </a-entity>
        <!-- Quest controllers (shown in VR). Left stick = walk. -->
        <a-entity id="left-hand" meta-touch-controls="hand: left"></a-entity>
        <a-entity id="right-hand" meta-touch-controls="hand: right"></a-entity>
      </a-entity>

      <!-- ROOM. hide-on-enter-ar: in passthrough AR on Quest 3 only the counter and objects stay,
           so it feels like looking through glasses. -->
      <a-plane
        id="floor"
        hide-on-enter-ar
        rotation="-90 0 0"
        width="6"
        height="6"
        color="#8f9aa8"
      ></a-plane>
      <a-plane
        id="wall"
        hide-on-enter-ar
        position="0 1.5 -1.6"
        width="6"
        height="3"
        color="#e8e1d5"
      ></a-plane>

      <!-- Debug helpers: floor grid (1 m), counter grid (10 cm), axes X red / Y green / Z blue. -->
      <a-entity debug-grid></a-entity>

      <!-- COUNTER: 2.0 m wide, 0.6 m deep, 0.9 m tall. Its centre is at y = 0.45,
           so its top surface is at y = 0.9. -->
      <a-box
        id="counter"
        position="0 0.45 -1.2"
        width="2"
        height="0.9"
        depth="0.6"
        color="#b58b5a"
      ></a-box>

      <!-- OBJECTS ON THE COUNTER. Each entity's origin is the point where it touches the counter
           (y = 0.9). The shapes inside use LOCAL positions, relative to that origin. -->
      <a-entity
        id="kettle"
        position="-0.6 0.9 -1.2"
        position-label="offsetY: -0.06; offsetZ: 0.32; width: 0.36"
      >
        <a-cylinder radius="0.09" height="0.2" position="0 0.1 0" color="#c9ced6"></a-cylinder>
        <a-cone
          radius-bottom="0.085"
          radius-top="0.025"
          height="0.07"
          position="0 0.235 0"
          color="#9aa3b0"
        ></a-cone>
        <a-torus
          radius="0.05"
          radius-tubular="0.009"
          position="0.11 0.12 0"
          color="#3a3f48"
        ></a-torus>
        <a-cylinder
          radius="0.015"
          height="0.09"
          position="-0.11 0.17 0"
          rotation="0 0 40"
          color="#c9ced6"
        ></a-cylinder>
        <!-- OBJECT-ANCHORED to the kettle: LOCAL position, 0.6 m above its origin. -->
        <a-entity
          id="timer-card"
          scale="1.5 1.5 1.5"
          hint-card="title: Timer; text: Tea ready in 2 min; tag: object-anchored; accent: #4da3ff; width: 0.5; height: 0.18"
          position="0 0.6 0.3"
          position-label="offsetY: -0.12; offsetZ: 0; width: 0.4"
        ></a-entity>
      </a-entity>

      <a-entity
        id="mug"
        position="0.95 0.9 -1.2"
        position-label="offsetY: -0.06; offsetZ: 0.32; width: 0.36"
      >
        <a-cylinder radius="0.04" height="0.09" position="0 0.045 0" color="#d9694f"></a-cylinder>
        <a-torus
          radius="0.025"
          radius-tubular="0.008"
          position="0.046 0.05 0"
          color="#d9694f"
        ></a-torus>
      </a-entity>

      <a-entity
        id="recipe"
        position="0.25 0.9 -1.2"
        position-label="offsetY: -0.06; offsetZ: 0.32; width: 0.36"
      >
        <a-box
          width="0.04"
          height="0.05"
          depth="0.04"
          position="0 0.025 -0.02"
          color="#6b5a45"
        ></a-box>
        <!-- the card leans back 15 degrees (rotation around X) -->
        <a-box
          width="0.22"
          height="0.15"
          depth="0.01"
          position="0 0.085 0"
          rotation="-15 0 0"
          color="#f6f1e4"
        >
          <a-box
            width="0.16"
            height="0.01"
            depth="0.002"
            position="0 0.04 0.006"
            color="#b9b19e"
          ></a-box>
          <a-box
            width="0.16"
            height="0.01"
            depth="0.002"
            position="0 0.01 0.006"
            color="#b9b19e"
          ></a-box>
          <a-box
            width="0.1"
            height="0.01"
            depth="0.002"
            position="-0.03 -0.02 0.006"
            color="#b9b19e"
          ></a-box>
        </a-box>
      </a-entity>

      <a-entity
        id="plant"
        position="0.7 0.9 -1.2"
        position-label="offsetY: -0.06; offsetZ: 0.32; width: 0.36"
      >
        <a-cylinder radius="0.06" height="0.1" position="0 0.05" color="#b4673f"></a-cylinder>
        <a-cone
          radius-bottom="0.03"
          radius-top="0"
          height="0.22"
          position="0 0.21 0"
          color="#4f9d63"
        ></a-cone>
        <a-cone
          radius-bottom="0.025"
          radius-top="0"
          height="0.18"
          position="0.05 0.19 0"
          rotation="0 0 -30"
          color="#5fb374"
        ></a-cone>
        <a-cone
          radius-bottom="0.025"
          radius-top="0"
          height="0.18"
          position="-0.05 0.19 0"
          rotation="0 0 30"
          color="#5fb374"
        ></a-cone>
        <a-sphere radius="0.045" position="0 0.3 0" color="#6cc283"></a-sphere>

        <!-- OBJECT-ANCHORED: a child of the plant. This position is LOCAL: 0.5 m above the plant's
             origin. Move the plant and the card comes along. face-camera turns it towards you. -->
        <a-entity
          id="plant-card"
          hint-card="title: Plant; text: Water me in 2 days; tag: object-anchored; accent: #5fd38d; width: 0.5; height: 0.18"
          face-camera
          position="0 0.5 0"
          position-label="offsetY: -0.12; offsetZ: 0; width: 0.4"
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
